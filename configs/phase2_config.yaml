data:
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  raw_path: "data/raw/prices.csv"
  processed_path: "data/processed/"

portfolio:
  lambda_val: 0.5

backtest:
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  train_window_months: 24   # 2 años in-sample
  test_window_months: 6     # 6 meses out-of-sample
  tickers: [
    'AAPL', 'MSFT', 'GOOGL', 'AMZN',          # US Tech
    'JPM', 'V', 'PG', 'KO',                   # US traditional/financial
    'SAN.MC', 'BBVA.MC', 'TEF.MC', 'IBE.MC'   # IBEX 35
  ]
  K: 3
  lambda_val: 0.5
  transaction_costs:
    institutional: 0.0005   # 0.05% (5 bps)
    retail: 0.0025          # 0.25% (25 bps)

experiments:
  seeds: [42, 43, 44, 45, 46]
  instances:
    high_n:
      N: [40]
      K: [3]
    high_p:
      N: [8]
      K: [2]
  timeout_seconds: 1800

solvers:
  sa:
    num_reads: 1000
    num_sweeps: 1000
  qaoa:
    p_list: [1, 8, 15]
    maxiter: 100
    shots: 1024
    optimizer: "COBYLA"
  xy_qaoa:
    p_high_n: [1, 2]
    p_high_p: [1, 2, 4, 8, 12, 15]
    maxiter: 100
    shots: 1024
    optimizer: "COBYLA"
  xy_qaoa_regularized:
    p: 2
    alpha: 0.1
    maxiter: 100
    shots: 1024
    optimizer: "COBYLA"
