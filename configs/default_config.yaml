data:
  start_date: "2019-01-01"
  end_date: "2024-12-31"
  raw_path: "data/raw/prices.csv"
  processed_path: "data/processed/"

portfolio:
  lambda_val: 0.5

solvers:
  sa:
    num_reads: 1000
    num_sweeps: 1000
  qaoa:
    p: [1, 2, 3, 4]
    maxiter: 100
    shots: 1024
    optimizer: "COBYLA"
  xy_qaoa:
    p: [1, 2, 3, 4]
    maxiter: 100
    shots: 1024
    optimizer: "COBYLA"
  jasp_qaoa:
    p: [2, 3, 4]
    maxiter: 100
    shots: 1024
    optimizer: "COBYLA"

experiments:
  seeds: [42, 43, 44, 45, 46]
  instances:
    validation:
      N: [6, 8, 10]
      K: [2, 2, 3]
    principal:
      N: [12, 14, 16]
      K: [3, 4, 4]
    scalability:
      N: [18, 20]
      K: [4, 5]
  timeout_seconds: 1800 # 30 minutes
